seed: 42
data:
  root: datasets/mvtec_ad
  categories: null
  image_size: 256
runtime:
  device: auto
  workers: 4
  amp: true
  cpu_threads: null
training:
  batch_size: 8
  epochs: 1000
  learning_rate: 0.00001
  weight_decay: 0.01
  checkpoint_every: 10
  output_dir: runs/mvtec_ad
evaluation:
  batch_size: 4
  ddim_steps: 10
