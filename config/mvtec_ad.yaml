    simplex_frequency: 8
  msadn:
    widths: [128, 256, 512]
    bottleneck_width: 384
  ahfg:
    heads: 4
    control_dim: 128
  unet:
    channels: [128, 256, 512, 768]
    time_width: 128
    blocks_per_level: 2
  diffusion:
    train_steps: 1000
    beta_start: 0.00085
    beta_end: 0.012
loss:
  asc:
    kl: 1.0
    feature: 0.1
    orthogonality: 0.1
  local:
    cosine: 1.0
    reconstruction: 0.5
    consistency: 0.1
  local_scale: 1.0
  total:
    asc: 1.0
    mfc: 0.5
